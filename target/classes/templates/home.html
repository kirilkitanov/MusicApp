<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music App</title>
    <link rel="stylesheet" href="/css/home.css">
</head>
<body class="home-page">

<div class="left-side">
    <!-- Информация за потребителя -->
    <div class="user-info">
        <h3>Welcome,</h3>
        <h3 th:if="${user.firstName != null or user.lastName != null}"
            th:text="${(user.firstName != null ? user.firstName : '') + (user.lastName != null ? ' ' + user.lastName : '')}">
        </h3>
        <h3 th:text="${#strings.capitalize(#strings.toLowerCase(user.role.name()))}">Fan</h3>
    </div>

    <!-- Бутоните под информацията -->
    <div class="nav-bar">
        <a th:href="@{/home}" class="nav-btn-active">All Albums</a>
        <a th:href="@{/albums/new}" class="nav-btn" th:if="${user.role.name() == 'ADMIN' || user.role.name() == 'ARTIST'}" >Add Album</a>
        <a th:href="@{/albums/personal}" class="nav-btn" th:if="${user.role.name() == 'ADMIN' || user.role.name() == 'ARTIST'}" >Uploaded Albums</a>
        <a th:href="@{/favourites}" class="nav-btn">Favourite Albums</a>
        <a th:href="@{/reviews/my-reviews}" class="nav-btn">My Reviews</a>
        <a th:href="@{/reviews/reported}" class="nav-btn" th:if="${user.role.name() == 'ADMIN'}" >Reported Reviews</a>
        <a th:href="@{'/users/' + ${user.id} + '/profile'}" class="nav-btn">Profile</a>
        <a th:href="@{/users}" class="nav-btn" th:if="${user.role.name() == 'ADMIN'}" >Users</a>
    </div>
    <a href="/logout" class="nav-btn logout-btn">Logout</a>
</div>
<div class="separator"></div>

<!-- Дясната част -->
<div class="album-container">

    <div class="album-row">

        <div class="album-card" th:each="album : ${albums}" th:if="${album.albumStatus == T(app.album.model.AlbumStatus).VISIBLE}">


            <div class="album-icons">
                <form th:if="${#lists.contains(favouriteAlbums, album.id.toString())}"
                      th:method="DELETE" th:action="@{'/favourites/' + ${album.id} + '?redirect=/home'}">
                    <button type="submit" class="icon-btn">
                        <img src="" th:src="@{/images/heart-solid.svg}" alt="Heart Icon" width="20" height="20">
                    </button>
                </form>

                <form th:if="${!#lists.contains(favouriteAlbums, album.id.toString())}"
                      th:action="@{'/favourites/' + ${album.id}}" method="POST">
                    <button type="submit" class="icon-btn">
                        <img src="" th:src="@{/images/heart-regular.svg}" alt="Heart Icon" width="20" height="20">
                    </button>
                </form>
            </div>

            <img src="" th:src="${album.albumCover != null && album.albumCover != '' ? album.albumCover : '/images/no-image-available.svg'}" alt="Album Cover">
            <h3 th:text="${album.albumName}">Album Name</h3>
            <p th:text="${album.artistName}">Artist Name</p>


            <div class="button-group">
                <a th:href="@{'/albums/' + ${album.id} + '/view'}" class="album-btn">See more</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
