<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Music App</title>
    <link href="/css/new-album.css" rel="stylesheet">
</head>
<body class="home-page">


<div class="left-side">
    <!-- Информация за потребителя -->
    <div class="user-info">
        <h3>Welcome,</h3>
        <h3 th:if="${user.firstName != null or user.lastName != null}"
            th:text="${(user.firstName != null ? user.firstName : '') + (user.lastName != null ? ' ' + user.lastName : '')}">
        </h3>
        <h3 th:text="${#strings.capitalize(#strings.toLowerCase(user.role.name()))}">Fan</h3>
    </div>

    <!-- Бутоните под информацията -->
    <div class="nav-bar">
        <a th:href="@{/home}" class="nav-btn">All Albums</a>
        <a th:href="@{/albums/new}" class="nav-btn-active" th:if="${user.role.name() == 'ADMIN' || user.role.name() == 'ARTIST'}" >Add Album</a>
        <a th:href="@{/albums/personal}" class="nav-btn" th:if="${user.role.name() == 'ADMIN' || user.role.name() == 'ARTIST'}" >Uploaded Albums</a>
        <a th:href="@{/favourites}" class="nav-btn">Favourite Albums</a>
        <a th:href="@{/reviews/my-reviews}" class="nav-btn">My Reviews</a>
        <a th:href="@{/reviews/reported}" class="nav-btn" th:if="${user.role.name() == 'ADMIN'}" >Reported Reviews</a>
        <a th:href="@{'/users/' + ${user.id} + '/profile'}" class="nav-btn">Profile</a>
        <a th:href="@{/users}" class="nav-btn" th:if="${user.role.name() == 'ADMIN'}" >Users</a>
    </div>
    <a class="nav-btn logout-btn" href="/logout">Logout</a>
</div>
<div class="separator"></div>

<!-- Дясната част -->
<div class="add-album-container">

    <form class="new-album-form"
          th:action="@{/albums}"
          th:method="POST"
          th:object="${newAlbumRequest}">

        <h2>Add Album</h2>

        <label><input placeholder="Artist" th:field="*{artistName}" type="text"></label>
        <p class="text-warning" th:errors="*{artistName}" th:if="${#fields.hasErrors('artistName')}"></p>

        <label><input placeholder="Album" th:field="*{albumName}" type="text"></label>
        <p class="text-warning" th:errors="*{albumName}" th:if="${#fields.hasErrors('albumName')}"></p>

        <label><input placeholder="Release Date" th:field="*{releaseDate}" type="text"></label>
        <p th:if="${#fields.hasErrors('releaseDate')}" th:errors="*{releaseDate}" class="text-warning"></p>

        <label><textarea placeholder="Description" th:field="*{description}" ></textarea></label>
        <p th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="text-warning"></p>

        <label><select class=".new-album-form select" id="genre" name="genre" th:field="*{genre}">
            <option value="">Select Genre</option>
            <option th:each="genre : ${T(app.album.model.Genre).values()}"
                    th:text="${#strings.capitalize(#strings.toLowerCase(genre))}"
                    th:value="${genre}">Genre
            </option>
        </select></label>
        <p class="text-warning" th:if="${#fields.hasErrors('genre')}" th:errors="*{genre}"></p>

        <label><input placeholder="Cover Url" th:field="*{albumCover}" type="url"></label>

        <label><input type="text" placeholder="YouTube Video ID" th:field="*{youtubeVideoId}"></label>
        <p th:if="${#fields.hasErrors('youtubeVideoId')}" th:errors="*{youtubeVideoId}" class="text-warning"></p>

        <button class="add-album-btn" type="submit">Add album</button>
    </form>
</div>

</body>
</html>
