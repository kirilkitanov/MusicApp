<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music App</title>
    <link rel="stylesheet" href="/css/uploaded-albums.css">
</head>
<body class="home-page">

<div class="left-side">
    <!-- Информация за потребителя -->
    <div class="user-info">
        <h3>Welcome,</h3>
        <h3 th:if="${user.firstName != null or user.lastName != null}"
            th:text="${(user.firstName != null ? user.firstName : '') + (user.lastName != null ? ' ' + user.lastName : '')}">
        </h3>
        <h3 th:text="${#strings.capitalize(#strings.toLowerCase(user.role.name()))}">Fan</h3>
    </div>

    <!-- Бутоните под информацията -->
    <div class="nav-bar">
        <a th:href="@{/home}" class="nav-btn">All Albums</a>
        <a th:href="@{/albums/new}" class="nav-btn" th:if="${user.role.name() == 'ADMIN' || user.role.name() == 'ARTIST'}" >Add Album</a>
        <a th:href="@{/albums/personal}" class="nav-btn" th:if="${user.role.name() == 'ADMIN' || user.role.name() == 'ARTIST'}" >Uploaded Albums</a>
        <a th:href="@{/favourites}" class="nav-btn">Favourite Albums</a>
        <a th:href="@{/reviews/my-reviews}" class="nav-btn">My Reviews</a>
        <a th:href="@{/reviews/reported}" class="nav-btn-active" th:if="${user.role.name() == 'ADMIN'}" >Reported Reviews</a>
        <a th:href="@{'/users/' + ${user.id} + '/profile'}" class="nav-btn">Profile</a>
        <a th:href="@{/users}" class="nav-btn" th:if="${user.role.name() == 'ADMIN'}" >Users</a>
    </div>
    <a href="/logout" class="nav-btn logout-btn">Logout</a>
</div>
<div class="separator"></div>

<!-- Дясната част -->
<div class="album-table-container">
    <table class="album-table">
        <thead>
        <tr>
            <th>Cover</th>
            <th>Artist</th>
            <th>Album</th>
            <th>Reviewer</th>
            <th>Review</th>
            <th>Reason</th>
            <th>Restore Review</th>
            <th>Delete Review</th>

        </tr>
        </thead>
        <tbody>
        <tr th:each="reportedReview : ${reportedReviews}" >
            <td>
                <img src="" th:src="${reportedReview.album.albumCover != null && reportedReview.album.albumCover != '' ? reportedReview.album.albumCover : '/images/no-image-available.svg'}" width="35px" height="35px" alt="">
            </td>
            <td th:text="${reportedReview.album.artistName}">Artist Name</td>
            <td> <a th:text="${reportedReview.album.albumName}" th:href="@{'/albums/' + ${reportedReview.album.id} + '/view'}">Album Name</a></td>
            <td th:text="${reportedReview.user.getUsername()}">Reviewer</td>
            <td class="review-comment-cell" th:text="${reportedReview.comment}">Review</td>
            <td th:text="${#strings.capitalize(reportedReview.reportReason.name().toLowerCase().replace('_', ' '))}">Reason</td>

            <td>
                <form th:method="PUT" th:action="@{'/reviews/' + ${reportedReview.id} + '/restore-reported'}">
                    <button type="submit" class="status-toggle-btn">Restore</button>
                </form>
            </td>


            <td>
                <form th:method="DELETE" th:action="@{'/reviews/' + ${reportedReview.id} + '?redirect=/reviews/reported'}">
                    <button type="submit" class="status-toggle-btn">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
