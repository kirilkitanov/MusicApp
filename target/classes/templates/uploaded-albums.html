<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music App</title>
    <link rel="stylesheet" href="/css/uploaded-albums.css">
</head>
<body class="home-page">

<div class="left-side">
    <!-- Информация за потребителя -->
    <div class="user-info">
        <h3>Welcome,</h3>
        <h3 th:if="${user.firstName != null or user.lastName != null}"
            th:text="${(user.firstName != null ? user.firstName : '') + (user.lastName != null ? ' ' + user.lastName : '')}">
        </h3>
        <h3 th:text="${#strings.capitalize(#strings.toLowerCase(user.role.name()))}">Fan</h3>
    </div>

    <!-- Бутоните под информацията -->
    <div class="nav-bar">
        <a th:href="@{/home}" class="nav-btn">All Albums</a>
        <a th:if="${user}" th:href="@{/albums/new}" class="nav-btn">Add Album</a>
        <a th:href="@{/albums/added}" class="nav-btn-active">Uploaded Albums</a>
        <a href="/my-favorites" class="nav-btn">Favorite Albums</a>
        <a href="/my-reviews" class="nav-btn">My Reviews</a>
        <a th:href="@{'/users/' + ${user.id} + '/profile'}" class="nav-btn">Edit Profile</a>
        <a href="/users" class="nav-btn">Users</a>
    </div>
    <a href="/logout" class="nav-btn logout-btn">Logout</a>
</div>
<div class="separator"></div>

<!-- Дясната част -->
<div class="album-table-container">
    <table class="album-table">
        <thead>
        <tr>
            <th>Artist</th>
            <th>Album</th>
            <th>Genre </th>
            <th>Release Date</th>
            <th>Status</th>
            <th>Change Status</th>
            <th>Edit Album</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td>Iron Maiden</td>
            <td>The number of the beast</td>
            <td>Metal</td>
            <td>1983</td>
            <td>
                <span text=""></span>
            </td>
            <td>
                <form method="" action="">
                    <button type="submit" class="status-toggle-btn">Hide</button>
                    </button>
                </form>
            </td>
            <td>
                <form method="" action="">
                    <button type="submit" class="status-toggle-btn">Edit</button>
                    </button>
                </form>
            </td>
        </tr>

        <tr>
            <td>Artist Name 2</td>
            <td>Artist Album 2</td>
            <td>Genre 2</td>
            <td>2023-10-15</td>
            <td>Inactive</td>
            <td>
                <form method="" action="">
                    <button type="submit" class="status-toggle-btn">Show</button>
                </form>
            </td>
            <td>
                <form method="" action="">
                    <button type="submit" class="status-toggle-btn">Edit</button>
                </form>
            </td>
        </tr>


        </tbody>
    </table>
</div>

</body>
</html>
