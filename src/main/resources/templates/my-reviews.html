<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music App</title>
    <link rel="stylesheet" href="/css/uploaded-albums.css">
</head>
<body class="home-page">

<div class="left-side">
    <!-- Информация за потребителя -->
    <div class="user-info">
        <h3>Welcome,</h3>
        <h3 th:if="${user.firstName != null or user.lastName != null}"
            th:text="${(user.firstName != null ? user.firstName : '') + (user.lastName != null ? ' ' + user.lastName : '')}">
        </h3>
        <h3 th:text="${#strings.capitalize(#strings.toLowerCase(user.role.name()))}">Fan</h3>
    </div>

    <!-- Бутоните под информацията -->
    <div class="nav-bar">
        <a th:href="@{/home}" class="nav-btn">All Albums</a>
        <a th:href="@{/albums/new}" class="nav-btn" th:if="${user.role.name() == 'ADMIN' || user.role.name() == 'ARTIST'}" >Add Album</a>
        <a th:href="@{/albums/added}" class="nav-btn" th:if="${user.role.name() == 'ADMIN' || user.role.name() == 'ARTIST'}" >Uploaded Albums</a>
        <a th:href="@{/albums/favourites}" class="nav-btn">Favourite Albums</a>
        <a th:href="@{/reviews/my-reviews}" class="nav-btn-active">My Reviews</a>
        <a th:href="@{/reviews/reported}" class="nav-btn" th:if="${user.role.name() == 'ADMIN'}" >Reported Reviews</a>
        <a th:href="@{'/users/' + ${user.id} + '/profile'}" class="nav-btn">Edit Profile</a>
        <a th:href="@{/users}" class="nav-btn" th:if="${user.role.name() == 'ADMIN'}" >Users</a>
    </div>
    <a href="/logout" class="nav-btn logout-btn">Logout</a>
</div>
<div class="separator"></div>

<!-- Дясната част -->
<div class="album-table-container">
    <table class="album-table">
        <thead>
        <tr>
            <th>Cover</th>
            <th>Artist</th>
            <th>Album</th>
            <th>Review</th>
            <th>Date</th>
            <th>Delete Review</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="review : ${reviews}" >
            <td>
                <img th:src="${review.album.albumCover != null && review.album.albumCover != '' ? review.album.albumCover : '/images/no-image-available.svg'}" width="35px" height="35px">
            </td>
            <td th:text="${review.album.artistName}">Artist Name</td>
            <td th:text="${review.album.albumName}">Album Name</td>
            <td class="review-comment-cell" th:text="${review.comment}">Review</td>
<!--            <td> <textarea readonly th:text="${review.comment}" type="text"></textarea></td>-->
            <td th:text="${#temporals.format(review.createdOn, 'dd MMM yyyy')}">Date</td>

            <td>
                <form th:method="DELETE" th:action="@{'/reviews/' + ${review.id} + '/delete'}">
                    <button type="submit" class="status-toggle-btn">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
