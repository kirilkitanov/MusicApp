<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music App</title>
  <link rel="stylesheet" href="/css/home.css">
</head>
<body class="home-page">

<div class="left-side">
  <!-- Информация за потребителя -->
  <div class="user-info">
    <h3>Welcome,</h3>
    <h3 th:if="${user.firstName != null or user.lastName != null}"
        th:text="${(user.firstName != null ? user.firstName : '') + (user.lastName != null ? ' ' + user.lastName : '')}">
    </h3>
    <h3 th:text="${#strings.capitalize(#strings.toLowerCase(user.role.name()))}">Fan</h3>
  </div>

  <!-- Бутоните под информацията -->
  <div class="nav-bar">
    <a th:href="@{/home}" class="nav-btn">All Albums</a>
    <a href="/add-album" class="nav-btn">Add New Album</a>
    <a href="/my-added-albums" class="nav-btn">My Added Albums</a>
    <a href="/my-favorites" class="nav-btn">My Favorite Albums</a>
    <a href="/my-reviews" class="nav-btn">My Reviews</a>
    <a th:href="@{'/users/' + ${user.id} + '/profile'}" class="nav-btn">Edit Profile</a>
    <a href="/users" class="nav-btn">Users</a>
  </div>
    <a href="/logout" class="nav-btn logout-btn">Logout</a>
</div>
<div class="separator"></div>

<!-- Дясната част -->
<div class="album-container">
  <div class="album-row">
    <div class="album-card">
      
      <div class="album-icons">
        <form method="post" action="">
          <button type="submit" class="icon-btn">
            <img th:src="@{/images/star-regular.svg}" alt="Star Icon" width="20" height="20">
          </button>
        </form>

        <form method="post" action="">
          <button type="submit" class="icon-btn">
            <img th:src="@{/images/heart-regular.svg}" alt="Heart Icon" width="20" height="20">
          </button>
      </form>
    </div>
      
      <img src="album1.jpg" alt="Album 1">
      <h3>Album Name 1</h3>
      <p>Rating: 4.5</p>     
            
      <div class="button-group">
        <button class="album-btn">Edit Album</button>
        <button class="album-btn">Delete Album</button>
      </div>
      <div class="button-group">
        <button class="album-btn">Add New Review</button>
        <button class="album-btn">Edit Review</button>
        <button class="album-btn">Delete Review</button>
      </div>
    </div>


    <div class="album-card">
      <img src="album2.jpg" alt="Album 2">
      <h3>Album Name 2</h3>
      <p>Rating: 4.2</p>
      <button class="album-btn">View Reviews</button>
      <button class="album-btn">Delete</button>
    </div>
    <div class="album-card">
      <img src="album3.jpg" alt="Album 3">
      <h3>Album Name 3</h3>
      <p>Rating: 5.0</p>
      <button class="album-btn">View Reviews</button>
      <button class="album-btn">Delete</button>
    </div>
    <div class="album-card">
      <img src="album4.jpg" alt="Album 4">
      <h3>Album Name 4</h3>
      <p>Rating: 3.9</p>
      <button class="album-btn">View Reviews</button>
      <button class="album-btn">Delete</button>
    </div>
  </div>
</div>
</body>
</html>
