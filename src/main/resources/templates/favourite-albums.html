<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music App</title>
    <link rel="stylesheet" href="/css/uploaded-albums.css">
</head>
<body class="home-page">

<div class="left-side">
    <div class="user-info">
        <h3>Welcome,</h3>
        <h3 th:if="${user.firstName != null or user.lastName != null}"
            th:text="${(user.firstName != null ? user.firstName : '') + (user.lastName != null ? ' ' + user.lastName : '')}">
        </h3>
        <h3 th:text="${#strings.capitalize(#strings.toLowerCase(user.role.name()))}">Fan</h3>
    </div>


    <div class="nav-bar">
        <a th:href="@{/home}" class="nav-btn">All Albums</a>
        <a th:href="@{/albums/new}" class="nav-btn" th:if="${user.role.name() == 'ADMIN' || user.role.name() == 'ARTIST'}" >Add Album</a>
        <a th:href="@{/albums/personal}" class="nav-btn" th:if="${user.role.name() == 'ADMIN' || user.role.name() == 'ARTIST'}" >Uploaded Albums</a>
        <a th:href="@{/favourites}" class="nav-btn-active">Favourite Albums</a>
        <a th:href="@{/reviews/my-reviews}" class="nav-btn">My Reviews</a>
        <a th:href="@{/reviews/reported}" class="nav-btn" th:if="${user.role.name() == 'ADMIN'}" >Reported Reviews</a>
        <a th:href="@{'/users/' + ${user.id} + '/profile'}" class="nav-btn">Profile</a>
        <a th:href="@{/users}" class="nav-btn" th:if="${user.role.name() == 'ADMIN'}" >Users</a>
    </div>
    <a href="/logout" class="nav-btn logout-btn">Logout</a>
</div>
<div class="separator"></div>


<div class="album-table-container">
    <table class="album-table">
        <thead>
        <tr>
            <th>Cover</th>
            <th>Artist</th>
            <th>Album</th>
            <th>Genre </th>
            <th>Release Date</th>
            <th>Show Album</th>
            <th>Remove Album</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="album : ${favorites}" th:if="${album.album.albumStatus == T(app.album.model.AlbumStatus).VISIBLE}">
            <td>
                <img src="" th:src="${album.album.albumCover != null && album.album.albumCover != '' ? album.album.albumCover : '/images/no-image-available.svg'}" width="35px" height="35px" alt="">
            </td>
            <td th:text="${album.album.artistName}">Artist Name</td>
            <td th:text="${album.album.albumName}">Album Name</td>
            <td th:text="${#strings.capitalize(#strings.toLowerCase(album.album.genre))}">Genre</td>
            <td th:text="${album.album.releaseDate}">Release Date</td>

            <td>
                <form th:action="@{'/albums/' + ${album.album.id} + '/view'}" method="GET">
                    <button type="submit" class="status-toggle-btn">See more</button>
                </form>
            </td>

            <td>
                <form th:method="DELETE" th:action="@{'/favourites/' + ${album.album.id} + '?redirect=/favourites'}">
                    <button type="submit" class="status-toggle-btn">Remove</button>
                </form>
            </td>

        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
