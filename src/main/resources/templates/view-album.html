<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music App</title>
    <link rel="stylesheet" href="/css/view-album.css">
</head>
<body class="home-page">
<div class="main-container">

<div class="left-side">
    <div class="user-info">
        <h3>Welcome,</h3>
        <h3 th:if="${user.firstName != null or user.lastName != null}"
            th:text="${(user.firstName != null ? user.firstName : '') + (user.lastName != null ? ' ' + user.lastName : '')}">
        </h3>
        <h3 th:text="${#strings.capitalize(#strings.toLowerCase(user.role.name()))}">Fan</h3>
    </div>

    <div class="nav-bar">
        <a th:href="@{/home}" class="nav-btn-active">All Albums</a>
        <a th:href="@{/albums/new}" class="nav-btn" th:if="${user.role.name() == 'ADMIN' || user.role.name() == 'ARTIST'}" >Add Album</a>
        <a th:href="@{/albums/personal}" class="nav-btn" th:if="${user.role.name() == 'ADMIN' || user.role.name() == 'ARTIST'}" >Uploaded Albums</a>
        <a th:href="@{/favourites}" class="nav-btn">Favourite Albums</a>
        <a th:href="@{/reviews/my-reviews}" class="nav-btn">My Reviews</a>
        <a th:href="@{/reviews/reported}" class="nav-btn" th:if="${user.role.name() == 'ADMIN'}" >Reported Reviews</a>
        <a th:href="@{'/users/' + ${user.id} + '/profile'}" class="nav-btn">Profile</a>
        <a th:href="@{/users}" class="nav-btn" th:if="${user.role.name() == 'ADMIN'}" >Users</a>
    </div>
    <a href="/logout" class="nav-btn logout-btn">Logout</a>
</div>
<div class="separator"></div>


<div class="album-container">
    <div class="album-info">
        <div class="album-details">

            <div class="album-image">
                <img src="" th:src="${album.albumCover != null && album.albumCover != '' ? album.albumCover : '/images/no-image-available.svg'}" alt="Album Cover">

                <div class="album-player" th:if="${album.youtubeVideoId != null and album.youtubeVideoId != ''}">
                    <iframe
                            id="youtube-player"
                            th:src="'https://www.youtube.com/embed/' + ${album.youtubeVideoId}"
                            allowfullscreen>
                    </iframe>
                </div>
            </div>

            <div class="album-text">
                <h2><span class="label">Album:</span> <span th:text="${album.albumName}"></span></h2>
                <h3><span class="label">Artist:</span> <span th:text="${album.artistName}"></span></h3>
                <h3><span class="label">Released:</span> <span th:text="${album.releaseDate}"></span></h3>
                <p><span class="label"><b>Description:</b></span>
                    <span th:text="${album.description}" class="album-description"></span></p>

                <div class="buy-cart-container">
                    <form th:if="${album.price != null}" th:action="@{'/cart/add/' + ${album.id}}" method="POST" class="buy-form">
                        <button type="submit" class="buy"
                                th:text="'Buy now for ' + ${album.price} + ' EUR'">Buy</button>
                    </form>

                    <div class="cart-info">
                        <a th:href="@{/cart}" class="cart-link">
                            <img src="/images/cart.svg" class="cart-icon" alt="Cart">
                            <span th:text="${cartTotal} + ' EUR'">0.00 EUR</span>
                        </a>
                    </div>
                </div>

            </div>
        </div>
        <form class="new-review-form" th:action="@{/reviews}" method="POST" th:object="${newReviewRequest}">
            <input type="hidden" th:field="*{albumId}"/>
            <label class="new-review-form"><textarea placeholder="Add a review" th:field="*{comment}" ></textarea></label>
            <p th:if="${#fields.hasErrors('comment')}" th:errors="*{comment}" class="text-warning"></p>
            <button type="submit" class="add-comment-btn">Add Review</button>
        </form>
    </div>

    <div class="reviews-section">
        <div class="reviews-list">
            <h4 class="label">All Reviews</h4>
            <ul>
                <li th:each="review : ${reviews}">
                    <div class="review-header">
                        <p class="label">
                            <span th:text="${review.user.username}">User Name</span> •
                            <span th:text="${#temporals.format(review.createdOn, 'dd MMM yyyy HH:mm')}">Date</span>
                        </p>
                        <form th:action="@{'/reviews/' + ${review.id} + '/report'}" method="GET">
                            <button type="submit"
                            th:classappend="${review.reported} ? 'reported-btn' : 'report-btn'"
                            th:text="${review.reported} ? 'Reported' : 'Report'"
                            th:disabled="${review.reported}">Report</button>
                        </form>
                    </div>
                    <p th:text="${review.comment}">Review content</p>
                </li>
            </ul>
        </div>
    </div>
</div>
</div>
</body>
</html>
